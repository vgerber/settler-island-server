name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # sqlx checks queries against the committed .sqlx data, so no database is needed to compile.
  SQLX_OFFLINE: "true"

jobs:
  gate:
    name: fmt, clippy, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The Godot client tests skip themselves when no godot binary is installed.
      - run: cargo test --workspace

  postgres:
    name: server tests with Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: settler
          POSTGRES_PASSWORD: settler
          POSTGRES_DB: settler_island
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U settler"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Each test creates its own database on this server.
      SETTLER_TEST_DATABASE_URL: postgres://settler:settler@127.0.0.1:5432/settler_island
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p settler_island_server
      # The committed .sqlx data must match the queries and migrations; sqlx-cli matches sqlx in Cargo.lock.
      - run: cargo install sqlx-cli --version 0.8.6 --locked --no-default-features --features postgres,rustls
      # The tests use their own databases; the check needs the schema in the service database.
      - run: cargo sqlx migrate run --source settler_island_server/migrations
        env:
          DATABASE_URL: postgres://settler:settler@127.0.0.1:5432/settler_island
      - run: cargo sqlx prepare --workspace --check
        env:
          SQLX_OFFLINE: "false"
          DATABASE_URL: postgres://settler:settler@127.0.0.1:5432/settler_island
