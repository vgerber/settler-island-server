[package]
name = "settler_island_server"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
unicode-general-category = "1.1"
settler_island_game = { path = "../settler_island_game" }
settler_island_bot = { path = "../settler_island_bot" }
settler_island_protocol = { path = "../settler_island_protocol" }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1.44", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
futures-util = { version = "0.3.31", default-features = false, features = ["std", "sink"] }
serde = { version = "1.0.193", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
argon2 = { version = "0.5", features = ["std"] }
rand = { version = "0.9", default-features = false, features = ["std", "thread_rng"] }
uuid = { version = "1.18", features = ["v4"] }
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
jsonwebtoken = "9.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio", "migrate", "json", "macros"] }
prometheus = { version = "0.14", default-features = false }
hyper-util = { version = "0.1.10", features = ["server-auto", "server-graceful", "service", "tokio"] }
tower-http = { version = "0.6", features = ["timeout", "limit"] }

[dev-dependencies]
tokio-tungstenite = "0.26"
rsa = "0.9"
