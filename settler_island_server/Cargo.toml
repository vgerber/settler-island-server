[package]
name = "settler_island_server"
version = "0.1.0"
edition = "2021"

[dependencies]
settler_island_game = { path = "../settler_island_game" }
settler_island_bot = { path = "../settler_island_bot" }
settler_island_protocol = { path = "../settler_island_protocol" }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1.44", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
futures-util = { version = "0.3.31", default-features = false, features = ["std", "sink"] }
serde = { version = "1.0.193", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
argon2 = { version = "0.5", features = ["std"] }
rand = { version = "0.9", default-features = false, features = ["std", "thread_rng"] }
uuid = { version = "1.18", features = ["v4"] }

[dev-dependencies]
tokio-tungstenite = "0.26"
